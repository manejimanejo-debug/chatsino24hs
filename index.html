<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Open 24hs | Chat</title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0B0D10;

    }


    body {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #0B0D10;

    }


    /* =====================================================
       PANTALLA DE CARGA
    ===================================================== */

    #loading-screen {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      z-index: 99999999;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:

        radial-gradient(
          circle at center,
          #27200D 0%,
          #15170F 30%,
          #0B0D10 65%,
          #070809 100%
        );

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }


    /* =====================================================
       LUZ DORADA
    ===================================================== */

    #loading-screen::before {

      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        rgba(212,175,55,0.10);

      filter: blur(80px);

      animation:
        goldGlow 2.5s ease-in-out infinite;

    }


    @keyframes goldGlow {

      0% {

        transform: scale(.8);

        opacity: .35;

      }

      50% {

        transform: scale(1.15);

        opacity: .85;

      }

      100% {

        transform: scale(.8);

        opacity: .35;

      }

    }


    /* =====================================================
       LOGO OROPURO
    ===================================================== */

    .loading-logo {

      position: relative;

      z-index: 2;

      color: #D4AF37;

      font-size: 38px;

      font-weight: 900;

      letter-spacing: 6px;

      text-align: center;

      text-shadow:

        0 0 5px rgba(212,175,55,.55),

        0 0 15px rgba(212,175,55,.30),

        0 0 30px rgba(212,175,55,.15);

      animation:
        logoPulse 2s ease-in-out infinite;

    }


    @keyframes logoPulse {

      0% {

        opacity: .65;

        transform: scale(.97);

      }

      50% {

        opacity: 1;

        transform: scale(1);

      }

      100% {

        opacity: .65;

        transform: scale(.97);

      }

    }


    /* =====================================================
       TEXTO DE CARGA
    ===================================================== */

    .loading-text {

      position: relative;

      z-index: 2;

      margin-top: 14px;

      color: #A8B0B8;

      font-size: 12px;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-align: center;

    }


    /* =====================================================
       SPINNER
    ===================================================== */

    .loader {

      position: relative;

      z-index: 2;

      width: 34px;
      height: 34px;

      margin-top: 28px;

      border-radius: 50%;

      border:
        3px solid rgba(212,175,55,.14);

      border-top-color:
        #D4AF37;

      border-right-color:
        #D4AF37;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =====================================================
       PUNTOS
    ===================================================== */

    .dots {

      position: relative;

      z-index: 2;

      margin-top: 12px;

      color: #D4AF37;

      font-size: 14px;

      letter-spacing: 4px;

      animation:
        dots 1.2s infinite;

    }


    @keyframes dots {

      0% {
        opacity: .25;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .25;
      }

    }


    /* =====================================================
       CONTENEDOR DEL CHAT
    ===================================================== */

    #custom_chat_holder {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      overflow: hidden;

      background: #0B0D10;

      z-index: 1;

    }


    /* =====================================================
       IFRAME DE KOMMO
    ===================================================== */

    #custom_chat_holder iframe {

      display: block !important;

      position: absolute !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 100% !important;
      min-height: 100% !important;

      border: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

    }


    /* =====================================================
       OCULTAR LOADING
    ===================================================== */

    #loading-screen.loaded {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 768px) {

      html,
      body {

        width: 100%;
        height: 100%;

        overflow: hidden;

        position: fixed;

        inset: 0;

      }


      #loading-screen {

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

      }


      #custom_chat_holder {

        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

      }


      .loading-logo {

        font-size: 34px;

        letter-spacing: 5px;

      }

    }


    /* =====================================================
       IPHONE / SAFARI
    ===================================================== */

    @supports (-webkit-touch-callout: none) {

      #loading-screen,
      #custom_chat_holder {

        height:
          -webkit-fill-available;

      }

    }


    /* =====================================================
       NOTIFICACIONES PUSH
    ===================================================== */

    #push-notification-button {

      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 100000000;

      border:
        1px solid
        rgba(212,175,55,.55);

      border-radius: 999px;

      padding: 11px 16px;

      background:
        rgba(17,21,26,.96);

      color:
        #D4AF37;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:

        0 8px 25px
        rgba(0,0,0,.35),

        0 0 18px
        rgba(212,175,55,.12);

      backdrop-filter:
        blur(8px);

      -webkit-backdrop-filter:
        blur(8px);

      transition:

        transform .15s ease,
        opacity .2s ease,
        border-color .2s ease;

    }


    #push-notification-button:hover {

      transform:
        translateY(-1px);

      border-color:
        #D4AF37;

    }


    #push-notification-button:disabled {

      cursor:
        default;

      opacity:
        .72;

    }


    #push-notification-button.push-enabled {

      color:
        #111111;

      background:
        #D4AF37;

      border-color:
        #D4AF37;

    }


    @media (max-width: 768px) {

      #push-notification-button {

        right: 12px;

        bottom: 12px;

        font-size: 12px;

        padding: 10px 14px;

      }

    }

  </style>


  <!-- =====================================================
       CONFIGURACIÓN DE KOMMO
    ===================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: 'frame',

        container:
          '#custom_chat_holder',

        locale: {

          extends: 'es',

          date_format:
            'dd.MM.YYYY',

          time_format:
            'HH:mm',

          compose_placeholder:
            'Escribe un mensaje...',

          delivery_status_sending:
            'Enviando',

          delivery_status_sent:
            'Enviado',

          delivery_status_read:
            'Leído',

          delivery_status_error:
            'Error',

          powered_by:
            'Desarrollado por',

          new_messages:
            'Nuevos mensajes'

        },


        theme: {

          background:
            '#0B0D10',

          system_color:
            '#D4AF37',

          header: {

            background:
              '#11151A',

            color:
              '#F5F5F5'

          },

          message: {

            outgoing_background:
              '#D4AF37',

            outgoing_color:
              '#111111',

            incoming_background:
              '#1C2229',

            incoming_color:
              '#F5F5F5'

          },

          compose: {

            height: 70,

            button_background:
              '#D4AF37'

          }

        }

      }

    };

  </script>

</head>


<body>


  <!-- =====================================================
       BOTÓN DE NOTIFICACIONES PUSH
    ===================================================== -->

  <button
    id="push-notification-button"
    type="button"
    aria-label="Activar notificaciones"
  >
    🔔 Activar notificaciones
  </button>


  <!-- =====================================================
       PANTALLA DE CARGA
    ===================================================== -->

  <div id="loading-screen">

    <div class="loading-logo">
      OROPURO
    </div>

    <div class="loading-text">
      Conectando con atención online
    </div>

    <div class="loader"></div>

    <div class="dots">
      • • •
    </div>

  </div>


  <!-- =====================================================
       CHAT REAL DE KOMMO
    ===================================================== -->

  <div id="custom_chat_holder"></div>


  <!-- =====================================================
       SCRIPT OFICIAL DE KOMMO
    ===================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id:
          "1079845",

        hash:
          "b5e2c2716e166aef9476333ef0b5228e8d50ef5b9728b9123d7f5d8d9282bb13",

        locale:
          "es",

        setMeta:
          function(p) {

            this.params =
              (this.params || [])
              .concat([p]);

          }

      };


      a[o] = a[o] || function() {

        (a[o].q = a[o].q || [])
          .push(arguments);

      };


      var d =
        a.document;


      var s =
        d.createElement('script');


      s.async = true;

      s.id =
        m + '_script';

      s.src =
        'https://gso.kommo.com/js/button.js';

  </script>


  <!-- =====================================================
       APERTURA AUTOMÁTICA
    ===================================================== -->

  <script>

    let attempts = 0;


    const checkKommo =
      setInterval(
        function() {

          attempts++;


          if (
            typeof window.crmPlugin ===
            'function'
          ) {

            try {

              window.crmPlugin(
                'runChatShow'
              );

            }

            catch (error) {

              console.log(
                'Esperando Kommo...'
              );

            }

          }


          if (
            attempts >= 150
          ) {

            clearInterval(
              checkKommo
            );

          }

        },

        100

      );

  </script>


  <!-- =====================================================
       DETECTAR CHAT LISTO
    ===================================================== -->

  <script>

    const loadingScreen =
      document.getElementById(
        'loading-screen'
      );


    const chatHolder =
      document.getElementById(
        'custom_chat_holder'
      );


    const observer =
      new MutationObserver(
        function() {

          const iframe =
            chatHolder.querySelector(
              'iframe'
            );


          if (iframe) {

            setTimeout(
              function() {

                loadingScreen
                  .classList
                  .add('loaded');

              },

              500

            );


            observer.disconnect();

          }

        }

      );


    observer.observe(

      chatHolder,

      {

        childList: true,

        subtree: true

      }

    );


    setTimeout(

      function() {

        loadingScreen
          .classList
          .add('loaded');

      },

      15000

    );

  </script>


  <!-- =====================================================
       NOTIFICACIONES PUSH
    ===================================================== -->

  <script>

    (() => {

      const VAPID_PUBLIC_KEY =
        "BGOrC2lpj8GwRTZHmB7GCBWLMNU04_BCJDGZtGcQIPUsDThO5QAbLL-qINYY4AyrGqlLqhQvCl_YzwyxVWiUATU";


      const button =
        document.getElementById(
          "push-notification-button"
        );


      if (!button) return;


      function urlBase64ToUint8Array(
        base64String
      ) {

        const padding =
          "=".repeat(
            (4 - (base64String.length % 4)) % 4
          );


        const base64 =
          (
            base64String + padding
          )
          .replace(/-/g, "+")
          .replace(/_/g, "/");


        const rawData =
          atob(base64);


        const outputArray =
          new Uint8Array(
            rawData.length
          );


        for (
          let i = 0;
          i < rawData.length;
          ++i
        ) {

          outputArray[i] =
            rawData.charCodeAt(i);

        }


        return outputArray;

      }


      function getClientId() {

        let clientId =
          localStorage.getItem(
            "open24hs_client_id"
          );


        if (!clientId) {

          clientId =
            (
              crypto.randomUUID
              ? crypto.randomUUID()
              : "client_" +
                Date.now() +
                "_" +
                Math.random()
                  .toString(36)
                  .slice(2)
            );


          localStorage.setItem(
            "open24hs_client_id",
            clientId
          );

        }


        return clientId;

      }


      function setButtonEnabledState() {

        button.textContent =
          "✓ Notificaciones activadas";


        button.classList.add(
          "push-enabled"
        );


        button.disabled =
          true;

      }


      async function registerPush() {

        if (
          !("serviceWorker" in navigator)
        ) {

          throw new Error(
            "Este navegador no soporta Service Worker."
          );

        }


        if (
          !("PushManager" in window)
        ) {

          throw new Error(
            "Este navegador no soporta notificaciones Push."
          );

        }


        if (
          !("Notification" in window)
        ) {

          throw new Error(
            "Este navegador no soporta notificaciones."
          );

        }


        if (
          location.protocol !== "https:" &&
          location.hostname !== "localhost"
        ) {

          throw new Error(
            "Las notificaciones requieren HTTPS."
          );

        }


        const permission =
          await Notification.requestPermission();


        if (
          permission !== "granted"
        ) {

          if (
            permission === "denied"
          ) {

            throw new Error(
              "Las notificaciones fueron bloqueadas en el navegador."
            );

          }


          throw new Error(
            "No se concedió permiso para las notificaciones."
          );

        }


        const registration =
          await navigator.serviceWorker.register(
            "/service-worker.js",
            {
              scope: "/"
            }
          );


        await navigator.serviceWorker.ready;


        let subscription =
          await registration
            .pushManager
            .getSubscription();


        if (!subscription) {

          subscription =
            await registration
              .pushManager
              .subscribe({

                userVisibleOnly:
                  true,

                applicationServerKey:
                  urlBase64ToUint8Array(
                    VAPID_PUBLIC_KEY
                  )

              });

        }


        const response =
          await fetch(
            "/api/push/subscribe",
            {

              method:
                "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  client_id:
                    getClientId(),

                  subscription:
                    subscription.toJSON()

                })

            }
          );


        let result = null;


        try {

          result =
            await response.json();

        }

        catch (_) {

          // Respuesta no JSON.

        }


        if (
          !response.ok ||
          !result ||
          result.ok !== true
        ) {

          throw new Error(

            (
              result &&
              (
                result.details ||
                result.error
              )
            )
            ||
            "El servidor no pudo guardar la suscripción."

          );

        }


        setButtonEnabledState();


        console.log(
          "OPEN 24HS: notificaciones push activadas",
          subscription
        );

      }


      async function initPushButton() {

        try {

          if (
            "serviceWorker" in navigator
          ) {

            const registration =
              await navigator
                .serviceWorker
                .register(
                  "/service-worker.js",
                  {
                    scope: "/"
                  }
                );


            await navigator.serviceWorker.ready;


            const existingSubscription =
              await registration
                .pushManager
                .getSubscription();


            if (

              existingSubscription &&

              "Notification" in window &&

              Notification.permission ===
                "granted"

            ) {

              setButtonEnabledState();

            }

          }

        }

        catch (error) {

          console.warn(
            "OPEN 24HS: Service Worker todavía no disponible.",
            error
          );

        }

      }


      button.addEventListener(

        "click",

        async () => {

          button.disabled =
            true;


          button.textContent =
            "⏳ Activando...";


          try {

            await registerPush();

          }

          catch (error) {

            console.error(
              "OPEN 24HS Push:",
              error
            );


            button.disabled =
              false;


            button.textContent =
              "🔔 Activar notificaciones";


            alert(

              "No se pudieron activar las notificaciones.\n\n" +
              error.message

            );

          }

        }

      );


      initPushButton();

    })();

  </script>


</body>
</html>

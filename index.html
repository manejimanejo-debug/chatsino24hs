<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /*
      CONTENEDOR DEL CHAT
    */

    #custom_chat_holder {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      min-width: 100%;
      min-height: 100%;

      background: #ffffff;
      overflow: hidden;

      z-index: 999999;
    }

    /*
      ELEMENTOS QUE KOMMO PUEDA CREAR
    */

    #custom_chat_holder iframe {
      display: block !important;

      position: absolute !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 100% !important;
      min-height: 100% !important;

      border: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /*
      CELULARES
    */

    @media (max-width: 768px) {

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100%;

        overflow: hidden;

        position: fixed;
        inset: 0;
      }

      #custom_chat_holder {
        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

        overflow: hidden;
      }
    }

    /*
      IPHONE / SAFARI
    */

    @supports (-webkit-touch-callout: none) {

      #custom_chat_holder {
        height: -webkit-fill-available;
      }

    }
  </style>

  <!-- =====================================================
       CONFIGURACIÓN DE KOMMO
       ===================================================== -->

  <script>

    window.crmPluginConfig = {

      /*
        IMPORTANTE:
        ocultamos el botón flotante
      */

      hidden: true,

      /*
        CHAT DENTRO DE NUESTRA PÁGINA
      */

      onlinechat: {

        mode: 'frame',

        container: '#custom_chat_holder',

        locale: {
          extends: 'es',
          date_format: 'dd.MM.YYYY',
          time_format: 'HH:mm',
          compose_placeholder: 'Escribe un mensaje...',
          delivery_status_sending: 'Enviando',
          delivery_status_sent: 'Enviado',
          delivery_status_read: 'Leído',
          delivery_status_error: 'Error',
          powered_by: 'Desarrollado por',
          new_messages: 'Nuevos mensajes'
        },

        theme: {
          header: {
            background: '#ffffff',
            color: '#222222'
          },

          message: {
            outgoing_background: '#2563eb',
            outgoing_color: '#ffffff',
            incoming_background: '#f1f1f1',
            incoming_color: '#222222'
          }
        }

      }

    };

  </script>

</head>

<body>

  <!-- =====================================================
       ACÁ KOMMO VA A INSERTAR EL CHAT REAL
       ===================================================== -->

  <div id="custom_chat_holder"></div>


  <!-- =====================================================
       CÓDIGO OFICIAL DE TU CHAT DE KOMMO
       ===================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id: "1079845",

        hash: "b5e2c2716e166aef9476333ef0b5228e8d50ef5b9728b9123d7f5d8d9282bb13",

        locale: "es",

        setMeta: function(p) {

          this.params = (this.params || []).concat([p]);

        }

      };

      a[o] = a[o] || function() {

        (a[o].q = a[o].q || []).push(arguments);

      };

      var d = a.document;

      var s = d.createElement('script');

      s.async = true;

      s.id = m + '_script';

      s.src = 'https://gso.kommo.com/js/button.js';

      d.head && d.head.appendChild(s);

    }(
      window,
      0,
      'crmPlugin',
      0,
      0,
      'crm_plugin'
    ));

  </script>


  <!-- =====================================================
       FORZAR APERTURA CUANDO KOMMO TERMINA DE CARGAR
       ===================================================== -->

  <script>

    function abrirChatKommo() {

      if (typeof window.crmPlugin === 'function') {

        try {

          window.crmPlugin('runChatShow');

        } catch (error) {

          console.log('Kommo todavía está inicializando...');

        }

      }

    }


    /*
      Esperamos a que Kommo termine de inicializar.
    */

    var intentos = 0;

    var esperarKommo = setInterval(function() {

      intentos++;

      if (typeof window.crmPlugin === 'function') {

        clearInterval(esperarKommo);

        /*
          Le damos un pequeño margen para
          terminar de crear el chat.
        */

        setTimeout(function() {

          abrirChatKommo();

        }, 300);

      }

      /*
        Dejamos de intentar después de 15 segundos.
      */

      if (intentos >= 150) {

        clearInterval(esperarKommo);

      }

    }, 100);


  </script>


</body>
</html>

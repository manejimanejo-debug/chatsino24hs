<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Open 24hs</title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #080808;

    }


    body {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #080808;

    }


    /* =====================================================
       PANTALLA DE CARGA OROPURO
    ===================================================== */

    #loading-screen {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      z-index: 99999999;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:
        radial-gradient(
          circle at center,
          #2b2410 0%,
          #151208 30%,
          #090909 65%,
          #030303 100%
        );

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }


    /* LUZ DORADA */

    #loading-screen::before {

      content: "";

      position: absolute;

      width: 280px;
      height: 280px;

      border-radius: 50%;

      background:
        rgba(212,175,55,0.12);

      filter: blur(75px);

      animation:
        goldGlow 2.5s ease-in-out infinite;

    }


    @keyframes goldGlow {

      0% {

        transform: scale(.8);

        opacity: .35;

      }

      50% {

        transform: scale(1.15);

        opacity: .9;

      }

      100% {

        transform: scale(.8);

        opacity: .35;

      }

    }


    /* =====================================================
       LOGO
    ===================================================== */

    .loading-logo {

      position: relative;

      z-index: 2;

      color: #d4af37;

      font-size: 38px;

      font-weight: 900;

      letter-spacing: 6px;

      text-align: center;

      text-shadow:

        0 0 5px rgba(212,175,55,.6),

        0 0 15px rgba(212,175,55,.4),

        0 0 35px rgba(212,175,55,.2);

      animation:
        logoPulse 2s ease-in-out infinite;

    }


    @keyframes logoPulse {

      0% {

        opacity: .65;

        transform: scale(.97);

      }

      50% {

        opacity: 1;

        transform: scale(1);

      }

      100% {

        opacity: .65;

        transform: scale(.97);

      }

    }


    /* =====================================================
       TEXTO CARGANDO
    ===================================================== */

    .loading-text {

      position: relative;

      z-index: 2;

      margin-top: 14px;

      color: #a7a7a7;

      font-size: 12px;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-align: center;

    }


    /* =====================================================
       SPINNER
    ===================================================== */

    .loader {

      position: relative;

      z-index: 2;

      width: 34px;
      height: 34px;

      margin-top: 28px;

      border-radius: 50%;

      border:
        3px solid rgba(212,175,55,.15);

      border-top-color:
        #d4af37;

      border-right-color:
        #d4af37;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    .dots {

      position: relative;

      z-index: 2;

      margin-top: 12px;

      color: #d4af37;

      font-size: 14px;

      letter-spacing: 4px;

      animation:
        dots 1.2s infinite;

    }


    @keyframes dots {

      0% {
        opacity: .25;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .25;
      }

    }


    /* =====================================================
       CONTENEDOR DEL CHAT REAL DE KOMMO
    ===================================================== */

    #custom_chat_holder {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      overflow: hidden;

      background: #090909;

      z-index: 1;

    }


    /* =====================================================
       IFRAME DE KOMMO
    ===================================================== */

    #custom_chat_holder iframe {

      display: block !important;

      position: absolute !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 100% !important;
      min-height: 100% !important;

      border: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

    }


    /* =====================================================
       OCULTAR PANTALLA DE CARGA
    ===================================================== */

    #loading-screen.loaded {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* =====================================================
       CELULARES
    ===================================================== */

    @media (max-width: 768px) {

      html,
      body {

        width: 100%;
        height: 100%;

        overflow: hidden;

        position: fixed;

        inset: 0;

      }


      #loading-screen {

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

      }


      #custom_chat_holder {

        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

      }


      .loading-logo {

        font-size: 34px;

        letter-spacing: 5px;

      }

    }


    /* =====================================================
       IPHONE / SAFARI
    ===================================================== */

    @supports (-webkit-touch-callout: none) {

      #loading-screen,
      #custom_chat_holder {

        height:
          -webkit-fill-available;

      }

    }

  </style>


  <!-- =====================================================
       CONFIGURACIÓN DE KOMMO
    ===================================================== -->

  <script>

    window.crmPluginConfig = {

      /*
       * NO MOSTRAR BOTÓN FLOTANTE
       */

      hidden: true,


      /*
       * CHAT REAL A PANTALLA COMPLETA
       */

      onlinechat: {

        mode: 'frame',

        container:
          '#custom_chat_holder',


        /* =================================================
           IDIOMA
        ================================================= */

        locale: {

          extends: 'es',

          date_format:
            'dd.MM.YYYY',

          time_format:
            'HH:mm',

          compose_placeholder:
            'Escribe un mensaje...',

          delivery_status_sending:
            'Enviando',

          delivery_status_sent:
            'Enviado',

          delivery_status_read:
            'Leído',

          delivery_status_error:
            'Error',

          powered_by:
            'Desarrollado por',

          new_messages:
            'Nuevos mensajes'

        },


        /* =================================================
           TEMA OSCURO / DORADO
        ================================================= */

        theme: {

          background:
            '#090909',

          system_color:
            '#d4af37',

          header: {

            background:
              '#0b0b0b',

            color:
              '#ffffff'

          },

          message: {

            outgoing_background:
              '#d4af37',

            outgoing_color:
              '#080808',

            incoming_background:
              '#1b1b1b',

            incoming_color:
              '#ffffff'

          },

          compose: {

            height: 70,

            button_background:
              '#d4af37'

          }

        }

      }

    };

  </script>

</head>


<body>


  <!-- =====================================================
       PANTALLA DE CARGA
    ===================================================== -->

  <div id="loading-screen">

    <div class="loading-logo">
      OROPURO
    </div>

    <div class="loading-text">
      Conectando con atención online
    </div>

    <div class="loader"></div>

    <div class="dots">
      • • •
    </div>

  </div>


  <!-- =====================================================
       CHAT REAL DE KOMMO
       NO HAY MENSAJES FALSOS ACÁ
    ===================================================== -->

  <div id="custom_chat_holder"></div>


  <!-- =====================================================
       SCRIPT OFICIAL DE TU KOMMO
    ===================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id:
          "1079845",

        hash:
          "b5e2c2716e166aef9476333ef0b5228e8d50ef5b9728b9123d7f5d8d9282bb13",

        locale:
          "es",

        setMeta:
          function(p) {

            this.params =
              (this.params || [])
              .concat([p]);

          }

      };


      a[o] = a[o] || function() {

        (a[o].q = a[o].q || [])
          .push(arguments);

      };


      var d =
        a.document;


      var s =
        d.createElement('script');


      s.async = true;

      s.id =
        m + '_script';

      s.src =
        'https://gso.kommo.com/js/button.js';


      d.head &&
        d.head.appendChild(s);


    }(

      window,

      0,

      'crmPlugin',

      0,

      0,

      'crm_plugin'

    ));

  </script>


  <!-- =====================================================
       PARÁMETRO PARA EL SALESBOT
    ===================================================== -->

  <script>

    /*
     * Este texto NO se dibuja en Vercel.
     *
     * Se envía como parámetro al Salesbot de Kommo.
     *
     * En el Salesbot podés utilizar:
     *
     * {{bot_params.welcome_message}}
     */

    const welcomeMessage =
      "👋 🎰 Hola, bienvenido a Open 24hs 🎰✨\n\n" +
      "🎁🔥 ¡Tenemos un bono del 100% en tu primera carga! 🔥🎁\n\n" +
      "📝 Pasame tu nombre y empezá a disfrutar 😎🎮";


    /*
     * Esperamos a que Kommo
     * haya creado crm_plugin.
     */

    let metaAttempts = 0;


    const sendBotParams =
      setInterval(
        function() {


          metaAttempts++;


          if (
            typeof window.crm_plugin !==
            'undefined' &&
            typeof window.crm_plugin.setMeta ===
            'function'
          ) {


            window.crm_plugin.setMeta({

              bot_params: {

                welcome_message:
                  welcomeMessage

              }

            });


            clearInterval(
              sendBotParams
            );

          }


          /*
           * También intentamos con
           * crmPlugin por compatibilidad.
           */

          else if (
            typeof window.crmPlugin ===
            'function'
          ) {

            try {

              window.crmPlugin.setMeta({

                bot_params: {

                  welcome_message:
                    welcomeMessage

                }

              });

              clearInterval(
                sendBotParams
              );

            }

            catch (error) {

              console.log(
                'Esperando inicialización de Kommo...'
              );

            }

          }


          if (
            metaAttempts >= 150
          ) {

            clearInterval(
              sendBotParams
            );

          }


        },

        100

      );

  </script>


  <!-- =====================================================
       ABRIR CHAT AUTOMÁTICAMENTE
    ===================================================== -->

  <script>

    let attempts = 0;


    const checkKommo =
      setInterval(
        function() {


          attempts++;


          if (
            typeof window.crmPlugin ===
            'function'
          ) {


            try {


              window.crmPlugin(
                'runChatShow'
              );


            }

            catch (error) {


              console.log(
                'Esperando Kommo...'
              );


            }

          }


          if (
            attempts >= 150
          ) {

            clearInterval(
              checkKommo
            );

          }


        },

        100

      );

  </script>


  <!-- =====================================================
       DETECTAR CUANDO EL CHAT ESTÁ LISTO
    ===================================================== -->

  <script>

    const loadingScreen =
      document.getElementById(
        'loading-screen'
      );


    const chatHolder =
      document.getElementById(
        'custom_chat_holder'
      );


    const observer =
      new MutationObserver(
        function() {


          const iframe =
            chatHolder.querySelector(
              'iframe'
            );


          if (iframe) {


            setTimeout(
              function() {


                loadingScreen
                  .classList
                  .add('loaded');


              },

              500

            );


            observer.disconnect();

          }

        }

      );


    observer.observe(

      chatHolder,

      {

        childList: true,

        subtree: true

      }

    );


    /*
     * Seguridad:
     * máximo 15 segundos de pantalla
     * de carga.
     */

    setTimeout(

      function() {

        loadingScreen
          .classList
          .add('loaded');

      },

      15000

    );

  </script>


</body>
</html>

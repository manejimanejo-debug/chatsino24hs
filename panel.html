<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Open 24hs | Panel de Alertas</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #0B0D10;
      color: #F5F5F5;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 650px;
      background: #11151A;
      border: 1px solid rgba(212,175,55,.25);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 8px;
      color: #D4AF37;
      font-size: 30px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #9AA3AD;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #303840;
      border-radius: 10px;
      padding: 13px;
      background: #0B0D10;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #D4AF37;
    }

    input[type="file"] {
      padding: 10px;
      cursor: pointer;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 24px;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #D4AF37;
      color: #111111;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: .6;
      cursor: default;
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #0B0D10;
      color: #A8B0B8;
      white-space: pre-wrap;
      display: none;
    }

    .stats {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #0B0D10;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #D4AF37;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .stat span {
      color: #8F98A1;
      font-size: 12px;
    }

    .preview {
      display: none;
      margin-top: 10px;
      border: 1px solid #303840;
      border-radius: 10px;
      padding: 10px;
      background: #0B0D10;
    }

    .preview-label {
      color: #8F98A1;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .preview img {
      display: block;
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
    }

    .hint {
      margin-top: 7px;
      color: #8F98A1;
      font-size: 12px;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      .panel {
        padding: 20px;
      }

      .stats {
        grid-template-columns: 1fr;
      }
    }

  </style>

</head>

<body>

  <div class="panel">

    <h1>🔔 Panel de Alertas</h1>

    <div class="subtitle">
      Enviá una notificación a todos los clientes registrados.
    </div>

    <label for="title">
      Título
    </label>

    <input
      id="title"
      type="text"
      value="Open 24hs"
      maxlength="80"
    >

    <label for="body">
      Mensaje
    </label>

    <textarea
      id="body"
      maxlength="500"
      placeholder="Escribí el mensaje que recibirán tus clientes..."
    ></textarea>

    <label for="image">
      Imagen de la notificación
    </label>

    <input
      id="image"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif"
    >

    <div class="hint">
      Seleccioná una imagen desde tu PC. El sistema la sube automáticamente.
      Límite de 2 MB por imagen.
    </div>

    <div
      id="image-preview"
      class="preview"
    >
      <div class="preview-label">
        Vista previa
      </div>

      <img
        id="image-preview-img"
        alt="Vista previa de la imagen"
      >
    </div>

    <label for="url">
      URL al tocar la notificación
    </label>

    <input
      id="url"
      type="url"
      value="https://chatsino24hs.vercel.app"
    >

    <button id="send">
      🚀 ENVIAR ALERTA A TODOS
    </button>

    <div
      id="status"
      class="status"
    ></div>

    <div
      id="stats"
      class="stats"
      style="display:none"
    >
      <div class="stat">
        <strong id="total">0</strong>
        <span>TOTAL</span>
      </div>

      <div class="stat">
        <strong id="sent">0</strong>
        <span>ENVIADAS</span>
      </div>

      <div class="stat">
        <strong id="failed">0</strong>
        <span>FALLIDAS</span>
      </div>
    </div>

  </div>

  <script>

    const button =
      document.getElementById("send");

    const status =
      document.getElementById("status");

    const stats =
      document.getElementById("stats");

    const total =
      document.getElementById("total");

    const sent =
      document.getElementById("sent");

    const failed =
      document.getElementById("failed");

    const imageInput =
      document.getElementById("image");

    const imagePreview =
      document.getElementById("image-preview");

    const imagePreviewImg =
      document.getElementById("image-preview-img");

    const MAX_IMAGE_SIZE =
      2 * 1024 * 1024;


    imageInput.addEventListener(
      "change",
      () => {

        const file =
          imageInput.files &&
          imageInput.files[0];

        if (!file) {

          imagePreview.style.display =
            "none";

          imagePreviewImg.removeAttribute(
            "src"
          );

          return;
        }

        if (file.size > MAX_IMAGE_SIZE) {

          imagePreview.style.display =
            "none";

          alert(
            "La imagen supera el límite de 2 MB."
          );

          imageInput.value = "";

          return;
        }

        const reader =
          new FileReader();

        reader.onload = () => {

          imagePreviewImg.src =
            String(reader.result);

          imagePreview.style.display =
            "block";

        };

        reader.readAsDataURL(file);

      }
    );


    async function uploadImage(
      file,
      secret
    ) {

      if (!file) {
        return null;
      }

      if (file.size > MAX_IMAGE_SIZE) {

        throw new Error(
          "La imagen supera el límite de 2 MB."
        );

      }

      const base64 =
        await new Promise(
          (resolve, reject) => {

            const reader =
              new FileReader();

            reader.onload = () => {

              const result =
                String(
                  reader.result || ""
                );

              const commaIndex =
                result.indexOf(",");

              resolve(
                commaIndex >= 0
                  ? result.slice(
                      commaIndex + 1
                    )
                  : result
              );

            };

            reader.onerror = () => {

              reject(
                new Error(
                  "No se pudo leer la imagen."
                )
              );

            };

            reader.readAsDataURL(
              file
            );

          }
        );


      const response =
        await fetch(
          "/api/push/upload",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "X-Push-Secret":
                secret
            },

            body:
              JSON.stringify({
                filename:
                  file.name,

                contentType:
                  file.type,

                data:
                  base64
              })
          }
        );


      const result =
        await response.json();


      if (
        !response.ok ||
        !result.ok
      ) {

        throw new Error(
          result.error ||
          "No se pudo subir la imagen."
        );

      }


      return result.url;

    }


    button.addEventListener(
      "click",
      async () => {

        const title =
          document
            .getElementById("title")
            .value
            .trim();

        const body =
          document
            .getElementById("body")
            .value
            .trim();

        const url =
          document
            .getElementById("url")
            .value
            .trim();

        const file =
          imageInput.files &&
          imageInput.files[0];


        if (!title || !body) {

          alert(
            "Completá el título y el mensaje."
          );

          return;
        }


        if (
          file &&
          file.size > MAX_IMAGE_SIZE
        ) {

          alert(
            "La imagen supera el límite de 2 MB."
          );

          return;
        }


        const secret =
          prompt(
            "Ingresá tu PUSH_ADMIN_SECRET:"
          );


        if (!secret) {
          return;
        }


        button.disabled = true;

        button.textContent =
          "⏳ PREPARANDO...";

        status.style.display =
          "block";

        status.textContent =
          "Preparando la alerta...";

        stats.style.display =
          "none";


        try {

          let imageUrl =
            null;


          if (file) {

            status.textContent =
              "⏳ Subiendo imagen...";

            imageUrl =
              await uploadImage(
                file,
                secret
              );

          }


          status.textContent =
            "⏳ Enviando alerta a todos los clientes...";


          const response =
            await fetch(
              "/api/push/broadcast",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "X-Push-Secret":
                    secret
                },

                body:
                  JSON.stringify({
                    title,
                    body,
                    image:
                      imageUrl,
                    url
                  })
              }
            );


          const result =
            await response.json();


          if (
            !response.ok ||
            !result.ok
          ) {

            throw new Error(
              result.error ||
              "No se pudo enviar la alerta."
            );

          }


          status.textContent =
            "✅ ALERTA ENVIADA CORRECTAMENTE";


          total.textContent =
            result.total ?? 0;


          sent.textContent =
            result.sent ?? 0;


          failed.textContent =
            result.failed ?? 0;


          stats.style.display =
            "grid";


          imageInput.value = "";

          imagePreview.style.display =
            "none";

          imagePreviewImg.removeAttribute(
            "src"
          );

        } catch (error) {

          status.textContent =
            "❌ ERROR\n\n" +
            error.message;

        } finally {

          button.disabled = false;

          button.textContent =
            "🚀 ENVIAR ALERTA A TODOS";

        }

      }
    );

  </script>

</body>
</html>

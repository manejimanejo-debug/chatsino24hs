<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Open 24hs | Chat</title>


  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0B0D10;

    }


    body {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      height: 100dvh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #0B0D10;

    }


    /* =====================================================
       PANTALLA DE CARGA
    ===================================================== */

    #loading-screen {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      z-index: 99999999;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      background:

        radial-gradient(
          circle at center,
          #27200D 0%,
          #15170F 30%,
          #0B0D10 65%,
          #070809 100%
        );

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;

    }


    /* =====================================================
       LUZ DORADA
    ===================================================== */

    #loading-screen::before {

      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        rgba(212,175,55,0.10);

      filter: blur(80px);

      animation:
        goldGlow 2.5s ease-in-out infinite;

    }


    @keyframes goldGlow {

      0% {

        transform: scale(.8);

        opacity: .35;

      }

      50% {

        transform: scale(1.15);

        opacity: .85;

      }

      100% {

        transform: scale(.8);

        opacity: .35;

      }

    }


    /* =====================================================
       LOGO OROPURO
    ===================================================== */

    .loading-logo {

      position: relative;

      z-index: 2;

      color: #D4AF37;

      font-size: 38px;

      font-weight: 900;

      letter-spacing: 6px;

      text-align: center;

      text-shadow:

        0 0 5px rgba(212,175,55,.55),

        0 0 15px rgba(212,175,55,.30),

        0 0 30px rgba(212,175,55,.15);

      animation:
        logoPulse 2s ease-in-out infinite;

    }


    @keyframes logoPulse {

      0% {

        opacity: .65;

        transform: scale(.97);

      }

      50% {

        opacity: 1;

        transform: scale(1);

      }

      100% {

        opacity: .65;

        transform: scale(.97);

      }

    }


    /* =====================================================
       TEXTO DE CARGA
    ===================================================== */

    .loading-text {

      position: relative;

      z-index: 2;

      margin-top: 14px;

      color: #A8B0B8;

      font-size: 12px;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-align: center;

    }


    /* =====================================================
       SPINNER
    ===================================================== */

    .loader {

      position: relative;

      z-index: 2;

      width: 34px;
      height: 34px;

      margin-top: 28px;

      border-radius: 50%;

      border:
        3px solid rgba(212,175,55,.14);

      border-top-color:
        #D4AF37;

      border-right-color:
        #D4AF37;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }


    /* =====================================================
       PUNTOS
    ===================================================== */

    .dots {

      position: relative;

      z-index: 2;

      margin-top: 12px;

      color: #D4AF37;

      font-size: 14px;

      letter-spacing: 4px;

      animation:
        dots 1.2s infinite;

    }


    @keyframes dots {

      0% {
        opacity: .25;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: .25;
      }

    }


    /* =====================================================
       CONTENEDOR DEL CHAT
    ===================================================== */

    #custom_chat_holder {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      overflow: hidden;

      background: #0B0D10;

      z-index: 1;

    }


    /* =====================================================
       IFRAME DE KOMMO
    ===================================================== */

    #custom_chat_holder iframe {

      display: block !important;

      position: absolute !important;

      top: 0 !important;
      left: 0 !important;

      width: 100% !important;
      height: 100% !important;

      min-width: 100% !important;
      min-height: 100% !important;

      border: 0 !important;

      margin: 0 !important;
      padding: 0 !important;

    }


    /* =====================================================
       OCULTAR LOADING
    ===================================================== */

    #loading-screen.loaded {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 768px) {

      html,
      body {

        width: 100%;
        height: 100%;

        overflow: hidden;

        position: fixed;

        inset: 0;

      }


      #loading-screen {

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

      }


      #custom_chat_holder {

        position: fixed;

        top: 0;
        right: 0;
        bottom: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        width: 100dvw;
        height: 100dvh;

      }


      .loading-logo {

        font-size: 34px;

        letter-spacing: 5px;

      }

    }


    /* =====================================================
       IPHONE / SAFARI
    ===================================================== */

    @supports (-webkit-touch-callout: none) {

      #loading-screen,
      #custom_chat_holder {

        height:
          -webkit-fill-available;

      }

    }

  </style>


  <!-- =====================================================
       CONFIGURACIÓN DE KOMMO
    ===================================================== -->

  <script>

    window.crmPluginConfig = {

      /*
       * No mostrar botón flotante
       */

      hidden: true,


      /*
       * CHAT A PANTALLA COMPLETA
       */

      onlinechat: {

        mode: 'frame',

        container:
          '#custom_chat_holder',


        /* =================================================
           IDIOMA
        ================================================= */

        locale: {

          extends: 'es',

          date_format:
            'dd.MM.YYYY',

          time_format:
            'HH:mm',

          compose_placeholder:
            'Escribe un mensaje...',

          delivery_status_sending:
            'Enviando',

          delivery_status_sent:
            'Enviado',

          delivery_status_read:
            'Leído',

          delivery_status_error:
            'Error',

          powered_by:
            'Desarrollado por',

          new_messages:
            'Nuevos mensajes'

        },


        /* =================================================
           TEMA OROPURO
        ================================================= */

        theme: {


          /*
           * FONDO GENERAL
           */

          background:
            '#0B0D10',


          /*
           * FECHAS Y ESTADOS
           */

          system_color:
            '#D4AF37',


          /*
           * HEADER
           */

          header: {

            background:
              '#11151A',

            color:
              '#F5F5F5'

          },


          /*
           * MENSAJES
           */

          message: {


            /*
             * CLIENTE
             */

            outgoing_background:
              '#D4AF37',

            outgoing_color:
              '#111111',


            /*
             * KOMMO / OPERADOR
             */

            incoming_background:
              '#1C2229',

            incoming_color:
              '#F5F5F5'

          },


          /*
           * CAMPO DE ESCRITURA
           */

          compose: {

            height: 70,

            button_background:
              '#D4AF37'

          }

        }

      }

    };

  </script>

</head>


<body>


  <!-- =====================================================
       PANTALLA DE CARGA
    ===================================================== -->

  <div id="loading-screen">

    <div class="loading-logo">
      OROPURO
    </div>


    <div class="loading-text">
      Conectando con atención online
    </div>


    <div class="loader"></div>


    <div class="dots">
      • • •
    </div>

  </div>


  <!-- =====================================================
       CHAT REAL DE KOMMO
    ===================================================== -->

  <div id="custom_chat_holder"></div>


  <!-- =====================================================
       SCRIPT OFICIAL DE KOMMO
    ===================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id:
          "1079845",

        hash:
          "b5e2c2716e166aef9476333ef0b5228e8d50ef5b9728b9123d7f5d8d9282bb13",

        locale:
          "es",

        setMeta:
          function(p) {

            this.params =
              (this.params || [])
              .concat([p]);

          }

      };


      a[o] = a[o] || function() {

        (a[o].q = a[o].q || [])
          .push(arguments);

      };


      var d =
        a.document;


      var s =
        d.createElement('script');


      s.async = true;

      s.id =
        m + '_script';

      s.src =
        'https://gso.kommo.com/js/button.js';


      d.head &&
        d.head.appendChild(s);


    }(

      window,

      0,

      'crmPlugin',

      0,

      0,

      'crm_plugin'

    ));

  </script>


  <!-- =====================================================
       APERTURA AUTOMÁTICA
    ===================================================== -->

  <script>

    let attempts = 0;


    const checkKommo =
      setInterval(
        function() {


          attempts++;


          if (
            typeof window.crmPlugin ===
            'function'
          ) {


            try {

              window.crmPlugin(
                'runChatShow'
              );

            }

            catch (error) {

              console.log(
                'Esperando Kommo...'
              );

            }

          }


          if (
            attempts >= 150
          ) {

            clearInterval(
              checkKommo
            );

          }


        },

        100

      );

  </script>


  <!-- =====================================================
       DETECTAR CHAT LISTO
    ===================================================== -->

  <script>

    const loadingScreen =
      document.getElementById(
        'loading-screen'
      );


    const chatHolder =
      document.getElementById(
        'custom_chat_holder'
      );


    const observer =
      new MutationObserver(
        function() {


          const iframe =
            chatHolder.querySelector(
              'iframe'
            );


          if (iframe) {


            setTimeout(
              function() {

                loadingScreen
                  .classList
                  .add('loaded');

              },

              500

            );


            observer.disconnect();

          }

        }

      );


    observer.observe(

      chatHolder,

      {

        childList: true,

        subtree: true

      }

    );


    /*
     * Seguridad:
     * máximo 15 segundos
     */

    setTimeout(

      function() {

        loadingScreen
          .classList
          .add('loaded');

      },

      15000

    );

  </script>


</body>
</html>
